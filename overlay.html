<!DOCTYPE html>
<html lang="ru" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCH Overlay — OBS Browser Source</title>
    <meta name="description" content="Random Challenge Hub OBS overlay — Browser Source для стримов. Виджеты рулетки, таймера и результатов прямо в OBS.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="favicon/favicon.png">
    <link rel="stylesheet" href="style.css">
    <!-- i18n: load translation files BEFORE i18n.js -->
    <script src="i18n/en.js"></script>
    <script src="i18n/ru.js"></script>
    <!-- Community translations: add <script src="i18n/xx.js"></script> here -->
    <script src="i18n/i18n.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body.chromakey { background: #00ff00 !important }

        #overlayRoot {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        /* ── WIDGET BASE ── */
        .overlay-widget {
            position: fixed;
            background: rgba(13, 17, 23, 0.92);
            border: 2px solid var(--accent-primary, #6366f1);
            border-radius: 16px;
            padding: 14px 18px;
            min-width: 260px;
            max-width: 340px;
            backdrop-filter: blur(14px);
            pointer-events: all;
            box-shadow: 0 0 30px rgba(99,102,241,0.35), 0 8px 24px rgba(0,0,0,0.7);
            animation: widgetIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
            user-select: none;
            touch-action: none;
        }
        @keyframes widgetIn {
            from { opacity:0; transform:scale(0.85) translateY(-16px) }
            to   { opacity:1; transform:scale(1)    translateY(0)      }
        }
        /* ── DRAG HANDLE ── */
        .widget-drag-handle {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 36px;
            cursor: grab;
            border-radius: 14px 14px 0 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 10px;
            gap: 6px;
        }
        .widget-drag-handle:active { cursor: grabbing }
        .widget-drag-dots {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            line-height: 1;
            transition: color 0.2s;
            letter-spacing: 2px;
        }
        .overlay-widget:hover .widget-drag-dots { color: rgba(255,255,255,0.55) }
        .overlay-widget.is-dragging {
            cursor: grabbing !important;
            box-shadow: 0 0 40px rgba(99,102,241,0.6), 0 12px 32px rgba(0,0,0,0.8);
            opacity: 0.95;
            transition: none !important;
        }
        .widget-close-btn {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: rgba(248,81,73,0.15);
            border: 1px solid rgba(248,81,73,0.3);
            color: rgba(248,81,73,0.6);
            font-size: 10px; line-height: 18px;
            text-align: center; cursor: pointer;
            transition: all 0.2s; display: none;
        }
        .overlay-widget:hover .widget-close-btn {
            display: block;
        }
        .widget-close-btn:hover {
            background: rgba(248,81,73,0.4);
            color: #fff;
        }

        /* ── HEADER ── */
        .ow-header {
            display: flex; align-items: center; gap: 8px;
            margin: 20px 0 10px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(99,102,241,0.3);
        }
        .ow-logo { font-size: 18px }
        .ow-title {
            font-family: 'Orbitron','Inter',sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            color: var(--accent-primary, #818cf8); text-transform: uppercase; flex: 1;
        }
        .ow-live-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #f85149; animation: livePulse 1.2s infinite;
            box-shadow: 0 0 6px #f85149;
        }
        @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        /* ── RESULT WIDGET ── */
        .ow-row { display:flex; align-items:baseline; gap:6px; margin-bottom:6px; animation: rowIn 0.35s ease }
        @keyframes rowIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
        .ow-label { font-size:9px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:1px; min-width:44px; flex-shrink:0 }
        .ow-value { font-size:13px; font-weight:600; color:rgba(255,255,255,0.9); flex:1; line-height:1.3 }
        .ow-value.game   { color:#818cf8 }
        .ow-value.player { color:#67e8f9 }
        .ow-value.task   { color:#3fb950; font-weight:700 }
        .ow-countdown { height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden; margin-top:8px }
        .ow-countdown-fill { height:100%; background:var(--accent-primary,#6366f1); border-radius:2px; transition:width 1s linear,background 0.3s }
        .ow-countdown-fill.urgent { background:#f85149 }

        /* ── VOTE WIDGET ── */
        .ow-vote-title { font-size:10px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px }
        .ow-vote-topic {
            font-size:13px; font-weight:700; text-align:center;
            color:#a78bfa; margin-bottom:8px; padding:6px 10px;
            background:rgba(99,102,241,0.12); border:1px solid rgba(99,102,241,0.25);
            border-radius:8px; line-height:1.35; word-break:break-word;
            animation: rowIn 0.35s ease;
        }
        .ow-vote-option { display:flex; align-items:center; gap:7px; margin-bottom:5px }
        .ow-vote-key { font-size:11px; font-weight:700; color:#818cf8; min-width:16px; text-align:center }
        .ow-vote-bar { flex:1; height:5px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden }
        .ow-vote-fill { height:100%; background:linear-gradient(90deg,#6366f1,#8b5cf6); border-radius:3px; transition:width 0.5s ease }
        .ow-vote-name { font-size:11px; color:rgba(255,255,255,0.7); min-width:80px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
        .ow-vote-count { font-size:10px; color:rgba(255,255,255,0.4); min-width:28px; text-align:right }
        .ow-vote-timer { font-family:'Orbitron',sans-serif; font-size:20px; font-weight:900; text-align:center; color:#fbbf24; margin:6px 0 }
        .ow-vote-timer.urgent { color:#f85149; animation:timerPulse 0.5s infinite }
        @keyframes timerPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

        /* ── WINNER ── */
        .ow-winner { text-align:center; padding:10px; animation:winnerAnim 0.8s cubic-bezier(0.34,1.56,0.64,1) }
        @keyframes winnerAnim { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
        .ow-winner-emoji { font-size:32px; margin-bottom:6px; display:block }
        .ow-winner-label { font-size:9px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; margin-bottom:3px }
        .ow-winner-name  { font-size:20px; font-weight:700; color:#3fb950 }
        .ow-winner-from  { font-size:10px; color:rgba(255,255,255,0.4); margin-top:3px }
        /* ── CHAT WIDGET ── */
        .chat-widget { min-width: 260px; max-width: 320px; max-height: 320px }
        .chat-messages { max-height: 200px; overflow-y: auto; font-size: 11px; line-height: 1.45 }
        .chat-message { margin-bottom: 4px; word-wrap: break-word; animation: chatIn 0.25s ease }
        @keyframes chatIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
        .chat-user { font-weight:600 }
        .chat-text { color:rgba(255,255,255,0.85); margin-left:4px }
        .chat-badge {
            display:inline-block; padding:1px 4px; border-radius:3px;
            font-size:8px; margin-right:3px; font-weight:600; text-transform:uppercase;
        }
        .chat-badge.broadcaster { background:#e91e63; color:#fff }
        .chat-badge.mod         { background:#00c853; color:#fff }
        .chat-badge.sub         { background:#9147ff; color:#fff }
        .chat-placeholder { color:rgba(255,255,255,0.35); text-align:center; padding:16px 0; font-style:italic; font-size:11px }
        .chat-messages::-webkit-scrollbar { width:3px }
        .chat-messages::-webkit-scrollbar-track { background:rgba(255,255,255,0.05) }
        .chat-messages::-webkit-scrollbar-thumb { background:rgba(129,140,248,0.4); border-radius:2px }

        /* ── TIMER WIDGET ── */
        .ow-timer-value {
            font-family: 'Orbitron', 'Inter', monospace;
            font-size: 38px; font-weight: 900; text-align: center;
            color: #f1f5f9; letter-spacing: 3px;
            line-height: 1; margin: 8px 0 4px;
            transition: color 0.3s;
        }
        .ow-timer-value.warning { color: #fbbf24 }
        .ow-timer-value.danger  { color: #f85149; animation: timerPulse 0.6s infinite }
        .ow-timer-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 6px }
        .ow-timer-bar-fill {
            height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 1s linear, background 0.3s;
        }
        .ow-timer-bar-fill.warning { background: linear-gradient(90deg, #f59e0b, #fbbf24) }
        .ow-timer-bar-fill.danger  { background: linear-gradient(90deg, #ef4444, #f85149) }
        .ow-timer-status {
            font-size: 9px; text-align: center; margin-top: 5px;
            color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px;
        }

        /* ── CONTROLS BAR ── */
        .ow-controls {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.88); backdrop-filter:blur(10px);
            padding: 10px 16px; display:flex; gap:8px; flex-wrap:wrap;
            border-top: 1px solid rgba(99,102,241,0.3);
            pointer-events: all; z-index: 99999;
        }
        .ow-controls.obs-hidden { display:none }
        .ow-ctrl-btn {
            padding:6px 14px; font-size:11px; font-weight:600;
            background:rgba(99,102,241,0.2); border:1px solid rgba(99,102,241,0.4);
            border-radius:8px; color:#818cf8; cursor:pointer;
            transition:all 0.2s; white-space:nowrap; pointer-events:all;
        }
        .ow-ctrl-btn:hover { background:rgba(99,102,241,0.4); transform:translateY(-1px) }
        .ow-ctrl-btn.active { background:rgba(99,102,241,0.6); color:#fff }
        .ow-ctrl-label { font-size:11px; color:rgba(255,255,255,0.35); align-self:center }

        /* snap guide lines */
        .snap-guide {
            position: fixed; background: rgba(99,102,241,0.4);
            pointer-events: none; z-index: 99998; display: none;
        }
        .snap-guide.h { left:0; right:0; height:1px }
        .snap-guide.v { top:0; bottom:0; width:1px }
    </style>
</head>
<body>
    <!-- Snap guides -->
    <div class="snap-guide h" id="snapH"></div>
    <div class="snap-guide v" id="snapV"></div>

    <div id="overlayRoot">

        <!-- RESULT WIDGET -->
        <div class="overlay-widget" id="resultWidget" style="top:18px;left:18px">
            <div class="widget-drag-handle">
                <span class="widget-close-btn" onclick="hideWidget('resultWidget')">✕</span>
                <span class="widget-drag-dots">⋮⋮⋮</span>
            </div>
            <div class="ow-header">
                <span class="ow-logo">🎲</span>
                <span class="ow-title" data-i18n="overlay.title">Random Challenge Hub</span>
                <span class="ow-live-dot"></span>
            </div>
            <div id="owIdle">
                <div class="ow-row">
                    <span class="ow-label">status</span>
                    <span class="ow-value" id="owIdleText" data-i18n="overlay.waiting">Ожидание результата...</span>
                </div>
            </div>
            <div id="owResult" style="display:none">
                <div class="ow-row"><span class="ow-label" data-i18n="overlay.game_label">🎮 Игра</span><span class="ow-value game" id="owGame"></span></div>
                <div class="ow-row"><span class="ow-label" data-i18n="overlay.player_label">👤 Игрок</span><span class="ow-value player" id="owPlayer"></span></div>
                <div class="ow-row"><span class="ow-label" data-i18n="overlay.task_label">⚡ Задание</span><span class="ow-value task" id="owTask"></span></div>
                <div class="ow-countdown"><div class="ow-countdown-fill" id="owCountdown" style="width:100%"></div></div>
            </div>
            <div id="owVote" style="display:none">
                <div class="ow-vote-title" data-i18n="overlay.vote_title">🗳️ Голосование в чате</div>
                <div class="ow-vote-topic" id="owVoteTopic" style="display:none"></div>
                <div class="ow-vote-timer" id="owVoteTimer">30с</div>
                <div id="owVoteOptions"></div>
            </div>
            <div id="owWinner" style="display:none">
                <div class="ow-winner">
                    <span class="ow-winner-emoji">🏆</span>
                    <div class="ow-winner-label" data-i18n="overlay.winner_label">Победитель</div>
                    <div class="ow-winner-name" id="owWinnerName"></div>
                    <div class="ow-winner-from" id="owWinnerFrom"></div>
                </div>
            </div>
        </div>

        <!-- CHAT WIDGET -->
        <div class="overlay-widget chat-widget" id="chatWidget" style="bottom:80px;right:18px;top:auto;left:auto;display:none">
            <div class="widget-drag-handle">
                <span class="widget-close-btn" onclick="hideWidget('chatWidget')">✕</span>
                <span class="widget-drag-dots">⋮⋮⋮</span>
            </div>
            <div class="ow-header">
                <span class="ow-logo">💬</span>
                <span class="ow-title" data-i18n="overlay.chat_title">Live Chat</span>
                <span class="ow-live-dot" id="chatLiveDot" style="display:none"></span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-placeholder" data-i18n="overlay.chat_empty">Чат не подключён</div>
            </div>
        </div>

        <!-- TIMER WIDGET -->
        <div class="overlay-widget" id="timerWidget" style="top:18px;right:18px;left:auto;min-width:200px;max-width:240px;display:none">
            <div class="widget-drag-handle">
                <span class="widget-close-btn" onclick="hideWidget('timerWidget')">✕</span>
                <span class="widget-drag-dots">⋮⋮⋮</span>
            </div>
            <div class="ow-header">
                <span class="ow-logo">⏱️</span>
                <span class="ow-title" data-i18n="overlay.timer_title">Таймер</span>
                <span class="ow-live-dot" id="timerLiveDot" style="display:none"></span>
            </div>
            <div class="ow-timer-value" id="owTimerValue">00:00</div>
            <div class="ow-timer-bar"><div class="ow-timer-bar-fill" id="owTimerFill" style="width:100%"></div></div>
            <div class="ow-timer-status" id="owTimerStatus" data-i18n="overlay.timer_waiting">ожидание</div>
        </div>

    </div>

    <!-- CONTROLS BAR -->
    <div class="ow-controls" id="owControls">
        <span class="ow-ctrl-label" data-i18n="overlay.preview">OBS Preview:</span>
        <button class="ow-ctrl-btn" onclick="showDemo('result')" data-i18n="overlay.btn_result">🎯 Результат</button>
        <button class="ow-ctrl-btn" onclick="showDemo('vote')" data-i18n="overlay.btn_vote">🗳️ Голосование</button>
        <button class="ow-ctrl-btn" onclick="showDemo('winner')" data-i18n="overlay.btn_winner">🏆 Победитель</button>
        <button class="ow-ctrl-btn" onclick="showIdle()" data-i18n="overlay.btn_idle">⏸ Ожидание</button>
        <button class="ow-ctrl-btn" onclick="toggleWidget('chatWidget')" data-i18n="overlay.btn_chat">💬 Чат</button>
        <button class="ow-ctrl-btn" onclick="toggleWidget('timerWidget')" data-i18n="overlay.btn_timer">⏱️ Таймер</button>
        <button class="ow-ctrl-btn" onclick="toggleTheme()" data-i18n="overlay.btn_theme">🎨 Тема</button>
        <button class="ow-ctrl-btn" onclick="toggleChroma()" data-i18n="overlay.btn_chroma">🟢 Chroma</button>
        <button class="ow-ctrl-btn" onclick="resetWidgetPositions()" data-i18n="overlay.btn_reset_pos">🔄 Сброс позиций</button>
        <button class="ow-ctrl-btn" onclick="togglePreview(this)" data-i18n="overlay.btn_hide_preview">👁️ Скрыть превью</button>
    </div>

<script>
// ═══════════════════════════════════════════════════
//  RCH OVERLAY — MAIN SCRIPT
// ═══════════════════════════════════════════════════

const THEMES    = ['dark','neon','cyber','streamer','pastel'];
const SNAP_PX   = 12; // snap threshold in pixels
let themeIdx    = 0;
let chromaOn    = false;
let countdownTimer = null;
let voteTimerInt   = null;

// ── INIT ──────────────────────────────────────────
(function init() {
    const p = new URLSearchParams(window.location.search);

    if (p.get('obs') === '1') {
        document.getElementById('owControls')?.classList.add('obs-hidden');
    }

    const t = p.get('theme') || localStorage.getItem('appTheme') || 'dark';
    applyTheme(t);

    if (p.get('chroma') === '1') document.body.classList.add('chromakey');

    // Restore hidden state for preview
    if (localStorage.getItem('overlayPreviewHidden') === 'true') {
        document.getElementById('owControls').style.display = 'none';
    }

    window.addEventListener('message', handleMessage);
    startPolling();

    // Drag & drop
    initDrag();
    loadAllPositions();
})();

// ── THEME ─────────────────────────────────────────
function applyTheme(name) {
    document.documentElement.setAttribute('data-theme', name);
    themeIdx = THEMES.indexOf(name); if (themeIdx < 0) themeIdx = 0;
}
function toggleTheme() { themeIdx = (themeIdx+1) % THEMES.length; applyTheme(THEMES[themeIdx]) }
function toggleChroma() { chromaOn = !chromaOn; document.body.classList.toggle('chromakey', chromaOn) }

// ── WIDGET VISIBILITY ─────────────────────────────
function showWidget(id)   { const w = document.getElementById(id); if (w) w.style.display = '' }
function hideWidget(id)   { const w = document.getElementById(id); if (w) w.style.display = 'none' }
function toggleWidget(id) {
    const w = document.getElementById(id);
    if (!w) return;
    const hidden = w.style.display === 'none' || w.style.display === '';

    // fix: treat 'none' as hidden, anything else as visible
    const isVisible = w.style.display !== 'none' && w.style.display !== '';
    if (isVisible) {
        w.style.display = 'none';
    } else {
        w.style.display = '';
    }
}

function togglePreview(btn) {
    const ctrl = document.getElementById('owControls');
    const hiding = ctrl.style.display !== 'none';
    localStorage.setItem('overlayPreviewHidden', hiding);
    if (hiding) {
        ctrl.style.display = 'none';
    } else {
        ctrl.style.display = '';
        if (btn && typeof t === 'function') btn.textContent = t('overlay.btn_hide_preview');
    }
}

// ── RESULT STATES ─────────────────────────────────
function showIdle() {
    _h('owResult'); _h('owVote'); _h('owWinner'); _s('owIdle');
    stopCountdown();
}
function showResult(game, player, task, duration) {
    _h('owIdle'); _h('owVote'); _h('owWinner'); _s('owResult');
    typeEl('owGame',   game   || '—', 30);
    typeEl('owPlayer', player || '—', 30);
    typeEl('owTask',   task   || '—', 20);
    if (duration > 0) startCountdown(duration);
}
function showVote(options, timerSec, title) {
    _h('owIdle'); _h('owResult'); _h('owWinner'); _s('owVote');
    // Показываем тему если есть
    const topicEl = document.getElementById('owVoteTopic');
    if (topicEl) {
        if (title && title.trim()) {
            topicEl.textContent = title.trim();
            topicEl.style.display = '';
        } else {
            topicEl.style.display = 'none';
        }
    }
    renderVoteOptions(options);
    runVoteTimer(timerSec || 30, options);
}
function showWinner(name, fromText) {
    _h('owIdle'); _h('owResult'); _h('owVote'); _s('owWinner');
    document.getElementById('owWinnerName').textContent = name || '?';
    document.getElementById('owWinnerFrom').textContent = fromText || '';
    stopCountdown();
}
function _s(id) { const e=document.getElementById(id); if(e) e.style.display='' }
function _h(id) { const e=document.getElementById(id); if(e) e.style.display='none' }

// Typewriter
function typeEl(id, text, speed) {
    const el = document.getElementById(id); if (!el) return;
    el.textContent = ''; let i = 0;
    const t = setInterval(() => { if (i < text.length) { el.textContent += text[i++] } else clearInterval(t) }, speed);
}

// Countdown bar
function startCountdown(ms) {
    stopCountdown();
    const bar = document.getElementById('owCountdown'); if (!bar) return;
    bar.style.width = '100%'; bar.classList.remove('urgent');
    const start = Date.now();
    countdownTimer = setInterval(() => {
        const pct = Math.max(0, 100 - ((Date.now()-start)/ms)*100);
        bar.style.width = pct + '%';
        if (pct < 20) bar.classList.add('urgent');
        if (pct <= 0) stopCountdown();
    }, 50);
}
function stopCountdown() { if (countdownTimer) { clearInterval(countdownTimer); countdownTimer=null } }

// Vote options
function renderVoteOptions(options) {
    const c = document.getElementById('owVoteOptions'); if (!c) return;
    c.innerHTML = (options||[]).map((o,i) => `
        <div class="ow-vote-option">
            <span class="ow-vote-key">${i+1}</span>
            <span class="ow-vote-name">${o.name||o}</span>
            <div class="ow-vote-bar"><div class="ow-vote-fill" id="vf${i}" style="width:${o.pct||0}%"></div></div>
            <span class="ow-vote-count" id="vc${i}">${o.count||0}</span>
        </div>`).join('');
}
function updateVoteOption(idx, pct, count) {
    const f=document.getElementById('vf'+idx); if(f) f.style.width=pct+'%';
    const c=document.getElementById('vc'+idx); if(c) c.textContent=count;
}

function runVoteTimer(sec, options) {
    if (voteTimerInt) clearInterval(voteTimerInt);
    let s = sec;
    const el = document.getElementById('owVoteTimer');
    if (el) { el.textContent=s+'с'; el.className='ow-vote-timer' }

    voteTimerInt = setInterval(() => {
        s--;
        if (el) { el.textContent=s+'с'; el.className='ow-vote-timer'+(s<=5?' urgent':'') }

        // Sync real votes from localStorage
        try {
            const sd = JSON.parse(localStorage.getItem('streamerState')||'{}');
            if (sd.voteActive && sd.voteVotes && options) {
                const votes = sd.voteVotes;
                const total = Object.values(votes).reduce((a,v)=>a+(v.count||0),0)||1;
                options.forEach((o,i)=>{
                    const c=(votes[i+1]?.count)||0;
                    updateVoteOption(i, Math.round(c/total*100), c);
                });
            }
        } catch(e){}

        if (s <= 0) {
            clearInterval(voteTimerInt);
            if (options?.length) {
                const w = options.reduce((mx,o)=>(o.count||0)>(mx.count||0)?o:mx, options[0]);
                setTimeout(()=>showWinner(w.name||w, `Победил в голосовании с ${w.count||0} голосами`), 800);
            }
        }
    }, 1000);
}

// ── postMessage BRIDGE ────────────────────────────
function handleMessage(e) {
    const d = e.data; if (!d?.type) return;
    if (d.type==='result') showResult(d.game, d.player, d.task, d.duration||6000);
    if (d.type==='vote')   showVote(d.options, d.timer, d.title||'');
    if (d.type==='winner') showWinner(d.name, d.from);
    if (d.type==='idle')   showIdle();
    if (d.type==='theme')  applyTheme(d.theme);
}

// ── POLLING ───────────────────────────────────────
let _lastOverlay = null;
let _lastChat    = null;

function startPolling() {
    setInterval(() => {
        try {
            // overlayState — результаты, голосование, победитель
            const raw = localStorage.getItem('overlayState');
            if (raw && raw !== _lastOverlay) {
                _lastOverlay = raw;
                const s = JSON.parse(raw);
                if (s.type==='result') showResult(s.game, s.player, s.task, s.duration);
                if (s.type==='vote')   showVote(s.options, s.timer, s.title||'');
                if (s.type==='winner') showWinner(s.name, s.from);
                if (s.type==='idle')   showIdle();
            }
            // overlayChatData — сообщения чата
            const cr = localStorage.getItem('overlayChatData');
            if (cr && cr !== _lastChat) { _lastChat=cr; updateChatWidget(JSON.parse(cr)) }
            // overlayTimer — таймер стримера
            const tr = localStorage.getItem('overlayTimer');
            if (tr) { try { updateTimerWidget(JSON.parse(tr)) } catch(e){} }
        } catch(e){}
    }, 500);
}

// ── CHAT WIDGET ───────────────────────────────────
function updateChatWidget(data) {
    const msgs = document.getElementById('chatMessages');
    const dot  = document.getElementById('chatLiveDot');
    if (!msgs) return;
    if (dot) dot.style.display = data?.connected ? '' : 'none';

    if (!data?.connected || !data?.messages?.length) {
        msgs.innerHTML = `<div class="chat-placeholder">${data?.connected ? 'Ожидание сообщений...' : 'Чат не подключён'}</div>`;
        return;
    }

    msgs.innerHTML = data.messages.slice(-20).map(m => {
        const badge = m.badge ? `<span class="chat-badge ${m.badge}">${
            m.badge==='broadcaster'?'СТРИМ':m.badge==='mod'?'МОД':m.badge==='sub'?'SUB':m.badge.toUpperCase()
        }</span>` : '';
        return `<div class="chat-message">${badge}<span class="chat-user" style="color:${m.color||'#818cf8'}">${esc(m.user)}:</span><span class="chat-text">${esc(m.text)}</span></div>`;
    }).join('');
    msgs.scrollTop = msgs.scrollHeight;
}

function esc(t) {
    const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML;
}

// ── TIMER WIDGET ──────────────────────────────────
function updateTimerWidget(data) {
    const val    = document.getElementById('owTimerValue');
    const fill   = document.getElementById('owTimerFill');
    const status = document.getElementById('owTimerStatus');
    const dot    = document.getElementById('timerLiveDot');
    if (!val) return;

    const t   = data.seconds || 0;
    const ini = data.initial || 0;
    const m   = Math.floor(t / 60);
    const s   = t % 60;
    const pct = ini > 0 ? Math.round((t / ini) * 100) : 0;

    val.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    // Цвет по остатку времени
    const cls = t <= 10 && t > 0 ? 'danger' : t <= 30 && t > 0 ? 'warning' : '';
    val.className   = 'ow-timer-value'   + (cls ? ' '+cls : '');
    if (fill) {
        fill.style.width  = pct + '%';
        fill.className    = 'ow-timer-bar-fill' + (cls ? ' '+cls : '');
    }
    if (status) status.textContent = data.running ? '▶ идёт отсчёт' : t > 0 ? '⏸ на паузе' : '— завершён';
    if (dot)    dot.style.display  = data.running ? '' : 'none';
}

// ── DEMO FUNCTIONS ────────────────────────────────
function showDemo(type) {
    try {
        const sd = JSON.parse(localStorage.getItem('streamerState')||'{}');
        const games = JSON.parse(localStorage.getItem('challengeGames')||'{}');
        const gl = Object.keys(games);

        if (type==='result') {
            const g = gl.length ? gl[Math.floor(Math.random()*gl.length)] : 'Minecraft';
            const tasks = games[g] || ['Выполните задание'];
            const task  = tasks[Math.floor(Math.random()*tasks.length)];
            showResult(g, sd.channelName || 'Стример', task, 8000);
        } else if (type==='vote') {
            const opts = (gl.length ? gl.slice(0,4) : ['Minecraft','CS2','Apex','Valorant']).map(n=>({name:n,count:0}));
            const demoTitle = sd.voteTitle || 'Тестовое голосование';
            showVote(opts, 20, demoTitle);
        } else if (type==='winner') {
            // chatUserPool не сохраняется — берём subWheelList или участников чата
            const pool = (sd.subWheelList && sd.subWheelList.length)
                ? sd.subWheelList
                : ['NightWolf99','GamerPro','TwitchViewer'];
            const winner = pool[Math.floor(Math.random() * pool.length)];
            const total  = sd.subWheelList?.length || pool.length;
            showWinner(winner, `из ${total} участников`);
        }
    } catch(e) {
        if (type==='result')  showResult('Minecraft','Стример','Выполните задание',8000);
        if (type==='vote')    showVote([{name:'Minecraft',count:0},{name:'CS2',count:0},{name:'Apex',count:0}],20);
        if (type==='winner')  showWinner('Зритель','из чата');
    }
}

// ── DRAG & DROP ───────────────────────────────────
const EDGE_SNAP = 12; // snap distance to screen edges & center

let drag_active  = false;
let drag_el      = null;
let drag_ox      = 0;   // cursor offset from widget left
let drag_oy      = 0;   // cursor offset from widget top
let drag_startX  = 0;
let drag_startY  = 0;

function initDrag() {
    // Attach to all current and future widgets via event delegation on document
    document.addEventListener('mousedown',  onDragStart, { passive: false });
    document.addEventListener('mousemove',  onDragMove,  { passive: false });
    document.addEventListener('mouseup',    onDragEnd);
    document.addEventListener('mouseleave', onDragEnd);

    // Touch support
    document.addEventListener('touchstart', onTouchStart, { passive: false });
    document.addEventListener('touchmove',  onTouchMove,  { passive: false });
    document.addEventListener('touchend',   onDragEnd);
}

function getHandle(target) {
    // Returns the widget if the click originated on the drag handle or the widget header area
    const handle = target.closest('.widget-drag-handle');
    if (handle) return handle.closest('.overlay-widget');
    return null;
}

function onDragStart(e) {
    // Ignore right-click and button clicks
    if (e.type==='mousedown' && e.button !== 0) return;
    const widget = getHandle(e.target);
    if (!widget) return;
    e.preventDefault();

    drag_active = true;
    drag_el     = widget;

    const rect = widget.getBoundingClientRect();
    drag_ox = e.clientX - rect.left;
    drag_oy = e.clientY - rect.top;
    drag_startX = rect.left;
    drag_startY = rect.top;

    widget.classList.add('is-dragging');
    // Ensure fixed positioning
    widget.style.position = 'fixed';
    widget.style.left = rect.left + 'px';
    widget.style.top  = rect.top  + 'px';
    widget.style.right  = 'auto';
    widget.style.bottom = 'auto';
    widget.style.zIndex = '9999';
    document.body.style.userSelect = 'none';
}

function onTouchStart(e) {
    const touch = e.touches[0];
    const handle = getHandle(touch.target);
    if (!handle) return;
    // Simulate mousedown
    onDragStart({ button:0, clientX: touch.clientX, clientY: touch.clientY,
        target: touch.target, preventDefault: ()=>e.preventDefault() });
}

function onDragMove(e) {
    if (!drag_active || !drag_el) return;
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
}
function onTouchMove(e) {
    if (!drag_active) return;
    e.preventDefault();
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
}

function moveDrag(cx, cy) {
    const W = drag_el.offsetWidth;
    const H = drag_el.offsetHeight;
    const VW = window.innerWidth;
    const VH = window.innerHeight;
    const controlsH = document.getElementById('owControls')?.offsetHeight || 0;

    let x = cx - drag_ox;
    let y = cy - drag_oy;

    // Hard bounds
    x = Math.max(0, Math.min(x, VW - W));
    y = Math.max(0, Math.min(y, VH - H - controlsH));

    // Snap to screen edges
    const snapGuideH = document.getElementById('snapH');
    const snapGuideV = document.getElementById('snapV');
    let snappedH = false, snappedV = false;

    // Left edge
    if (x < EDGE_SNAP) { x = 0; snappedV = true; if (snapGuideV) { snapGuideV.style.left='0'; snapGuideV.style.display='' } }
    // Right edge
    else if (x + W > VW - EDGE_SNAP) { x = VW - W; snappedV = true; if (snapGuideV) { snapGuideV.style.left=(VW-1)+'px'; snapGuideV.style.display='' } }
    // Horizontal center
    else if (Math.abs(x + W/2 - VW/2) < EDGE_SNAP) { x = VW/2 - W/2; snappedV = true; if (snapGuideV) { snapGuideV.style.left=(VW/2)+'px'; snapGuideV.style.display='' } }
    if (!snappedV && snapGuideV) snapGuideV.style.display = 'none';

    // Top edge
    if (y < EDGE_SNAP) { y = 0; snappedH = true; if (snapGuideH) { snapGuideH.style.top='0'; snapGuideH.style.display='' } }
    // Bottom edge
    else if (y + H > VH - controlsH - EDGE_SNAP) { y = VH - H - controlsH; snappedH = true; if (snapGuideH) { snapGuideH.style.top=(VH-controlsH-1)+'px'; snapGuideH.style.display='' } }
    // Vertical center
    else if (Math.abs(y + H/2 - VH/2) < EDGE_SNAP) { y = VH/2 - H/2; snappedH = true; if (snapGuideH) { snapGuideH.style.top=(VH/2)+'px'; snapGuideH.style.display='' } }
    if (!snappedH && snapGuideH) snapGuideH.style.display = 'none';

    drag_el.style.left = x + 'px';
    drag_el.style.top  = y + 'px';
}

function onDragEnd() {
    if (!drag_active || !drag_el) return;
    drag_active = false;

    const snapGuideH = document.getElementById('snapH');
    const snapGuideV = document.getElementById('snapV');
    if (snapGuideH) snapGuideH.style.display = 'none';
    if (snapGuideV) snapGuideV.style.display = 'none';

    drag_el.classList.remove('is-dragging');
    drag_el.style.zIndex = '';
    savePosition(drag_el);
    drag_el = null;
    document.body.style.userSelect = '';
}

// ── POSITION PERSISTENCE ─────────────────────────
function savePosition(widget) {
    const id = widget.id; if (!id) return;
    const rect = widget.getBoundingClientRect();
    localStorage.setItem('overlayPos_' + id, JSON.stringify({
        left: rect.left, top: rect.top,
        visible: widget.style.display !== 'none'
    }));
}

function loadAllPositions() {
    document.querySelectorAll('.overlay-widget').forEach(w => {
        const id = w.id; if (!id) return;
        const saved = localStorage.getItem('overlayPos_' + id);
        if (!saved) return;
        try {
            const p = JSON.parse(saved);
            // Clamp to viewport in case resolution changed
            const W = w.offsetWidth  || 280;
            const H = w.offsetHeight || 140;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const x = Math.max(0, Math.min(p.left, vw - W));
            const y = Math.max(0, Math.min(p.top,  vh - H));
            w.style.position = 'fixed';
            w.style.left   = x + 'px';
            w.style.top    = y + 'px';
            w.style.right  = 'auto';
            w.style.bottom = 'auto';
            // Restore visibility for streamer/chat widgets
            if (id !== 'resultWidget') {
                w.style.display = (p.visible === false) ? 'none' : '';
            }
        } catch(e){}
    });
}

function resetWidgetPositions() {
    document.querySelectorAll('.overlay-widget').forEach(w => {
        if (w.id) localStorage.removeItem('overlayPos_' + w.id);
        w.style.position = '';
        w.style.left = ''; w.style.top = '';
        w.style.right = ''; w.style.bottom = '';
    });
    // Reset defaults
    const rw = document.getElementById('resultWidget');
    if (rw) { rw.style.cssText = 'top:18px;left:18px'; }
    const cw = document.getElementById('chatWidget');
    if (cw) { cw.style.cssText = 'bottom:80px;right:18px;top:auto;left:auto;display:none'; }
    const tw = document.getElementById('timerWidget');
    if (tw) { tw.style.cssText = 'top:18px;right:18px;left:auto;min-width:200px;max-width:240px;display:none'; }
}
