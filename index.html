<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Random Challenge Hub",
    "alternateName": "RCH",
    "description": "Free interactive challenge roulette with OBS overlay for streamers and gamers. Twitch chat voting, 4 roulette modes, 5 themes and browser-based tools.",
    "url": "https://random-challenge-hub.vercel.app",
    "applicationCategory": "EntertainmentApplication",

    "operatingSystem": "Any",
    "inLanguage": "en",
    "isAccessibleForFree": true,
    "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
    },
    "featureList": [

<body>
    <a class="skip-link" href="#mainPanel" data-i18n="st.skip">Skip to content</a>
    <div class="container">

        <!-- HEADER -->
        <header class="app-header">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="5" width="38" height="38" rx="10" fill="currentColor"/><circle cx="16" cy="16" r="3.4" fill="var(--bg-primary)"/><circle cx="32" cy="16" r="3.4" fill="var(--bg-primary)"/><circle cx="24" cy="24" r="3.4" fill="var(--bg-primary)"/><circle cx="16" cy="32" r="3.4" fill="var(--bg-primary)"/><circle cx="32" cy="32" r="3.4" fill="var(--bg-primary)"/></svg>
                <div class="brand-text">
                    <h1 data-i18n-html="header.title">RANDOM CHALLENGE HUB</h1>
                    <p class="tagline" data-i18n="header.tagline"></p>
                </div>
            </div>
            <div class="header-tools">
                <div class="conn-chips" aria-live="polite">
                    <button type="button" class="conn-chip" data-svc="twitch" data-state="idle" onclick="switchTab('streamer')"><span class="conn-dot"></span><span class="conn-name">Twitch</span><span class="conn-label"></span></button>
                    <button type="button" class="conn-chip" data-svc="streamlabs" data-state="idle" onclick="switchTab('auction')"><span class="conn-dot"></span><span class="conn-name">Streamlabs</span><span class="conn-label"></span></button>
                    <button type="button" class="conn-chip" data-svc="donationalerts" data-state="idle" onclick="switchTab('auction')"><span class="conn-dot"></span><span class="conn-name">DonationAlerts</span><span class="conn-label"></span></button>
                </div>
                <div class="theme-switcher" id="themeSwitcher" role="group" aria-label="Theme">
                    <button class="theme-btn active" data-theme="dark"     title="Dark"     onclick="applyTheme('dark')"><i class="bi bi-moon-stars-fill" aria-hidden="true"></i></button>
                    <button class="theme-btn"        data-theme="neon"     title="Neon"     onclick="applyTheme('neon')"><i class="bi bi-heart-fill" aria-hidden="true"></i></button>
                    <button class="theme-btn"        data-theme="cyber"    title="Cyber"    onclick="applyTheme('cyber')"><i class="bi bi-circle-fill" aria-hidden="true"></i></button>
                    <button class="theme-btn"        data-theme="streamer" title="Streamer" onclick="applyTheme('streamer')"><i class="bi bi-broadcast" aria-hidden="true"></i></button>
                    <button class="theme-btn"        data-theme="pastel"   title="Pastel"   onclick="applyTheme('pastel')"><i class="bi bi-flower1" aria-hidden="true"></i></button>
                </div>
                <div id="langSlot"></div>
            </div>
        </header>

        <!-- About project -->
        <div class="about-project" id="aboutProject" hidden>
            <div class="about-card">
                <span class="about-icon"><i class="bi bi-bullseye" aria-hidden="true"></i></span>
                <h2 data-i18n="about.title">Random Challenge Hub v3</h2>
                <p class="about-description" data-i18n="about.description">
                    
                </p>
                <div class="features-grid">
                    <div class="feature-item"><span class="feature-icon"><i class="bi bi-pie-chart-fill" aria-hidden="true"></i></span><span class="feature-text" data-i18n="feat.roulette_modes"></span></div>
                    <div class="feature-item"><span class="feature-icon"><i class="bi bi-display" aria-hidden="true"></i></span><span class="feature-text" data-i18n="feat.obs_overlay"></span></div>
                    <div class="feature-item"><span class="feature-icon"><i class="bi bi-check2-square" aria-hidden="true"></i></span><span class="feature-text" data-i18n="feat.chat_vote"></span></div>
                    <div class="feature-item"><span class="feature-icon"><i class="bi bi-palette-fill" aria-hidden="true"></i></span><span class="feature-text" data-i18n="feat.themes"></span></div>
                    <div class="feature-item"><span class="feature-icon"><i class="bi bi-stopwatch-fill" aria-hidden="true"></i></span><span class="feature-text" data-i18n="feat.timer"></span></div>
                    <div class="feature-item"><span class="feature-icon"><i class="bi bi-controller" aria-hidden="true"></i></span><span class="feature-text" data-i18n="feat.bonus"></span></div>
                </div>
                <button onclick="dismissAbout()" class="cyber-btn start-exploring" data-i18n="about.start_btn">
                   
                </button>
            </div>
        </div>

        <!-- Main panel with tabs -->
        <div class="panel" id="mainPanel">
            <div class="loading-screen">
                <div class="loading-spinner"></div>
                <p class="loading-text" data-i18n="common.loading"></p>
            </div>
        </div>

        <!-- Information cards -->
        <div class="info-section" id="infoSection">
            <div class="info-card">
                <h3 data-i18n="info.how_title"></h3>
                <div class="steps-list">
                    <div class="step"><span class="step-number">1</span><p data-i18n="info.step1"></p></div>
                    <div class="step"><span class="step-number">2</span><p data-i18n="info.step2"></p></div>
                    <div class="step"><span class="step-number">3</span><p data-i18n="info.step3"></p></div>
                    <div class="step"><span class="step-number">4</span><p data-i18n="info.step4"></p></div>
                </div>
            </div>

            <div class="info-card">
                <h3 data-i18n="info.modes_title"></h3>
                <ul class="goals-list">
                    <li data-i18n-html="info.mode_full"></li>
                    <li data-i18n-html="info.mode_game_first"></li>
                    <li data-i18n-html="info.mode_player_only"></li>
                    <li data-i18n-html="info.mode_task_only"></li>
                </ul>
            </div>

            <div class="info-card">
                <h3 data-i18n="info.streamer_title"></h3>
                <div class="audience-grid">
                    <div class="audience-item">
                        <span class="audience-icon"><i class="bi bi-display" aria-hidden="true"></i></span>
                        <strong data-i18n="info.obs_label">OBS Overlay</strong>
                        <p data-i18n="info.obs_desc"></p>
                    </div>
                    <div class="audience-item">
                        <span class="audience-icon"><i class="bi bi-check2-square" aria-hidden="true"></i></span>
                        <strong data-i18n="info.vote_label"></strong>
                        <p data-i18n="info.vote_desc"></p>
                    </div>
                    <div class="audience-item">
                        <span class="audience-icon"><i class="bi bi-heart-fill" aria-hidden="true"></i></span>
                        <strong data-i18n="info.subs_label"></strong>
                        <p data-i18n="info.subs_desc"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div class="notifications-container" id="notifications"></div>

    <!-- Modal window -->
    <div class="modal hidden" id="confirmModal">
        <div class="modal-content">
            <h3 id="modalTitle" data-i18n="modal.confirm_default"></h3>
            <p id="modalMessage" data-i18n="modal.are_you_sure"></p>
            <div class="modal-actions">
                <button class="cyber-btn cancel-btn" onclick="closeModal()" data-i18n="common.cancel"></button>
                <button class="cyber-btn confirm-btn" id="modalConfirm" data-i18n="common.confirm"></button>
            </div>
        </div>
    </div>

    <!-- Popup result wheel — in body -->
    <div id="wheelResultPopup" class="wheel-result-popup hidden">
        <div class="popup-content">
            <div class="popup-game"></div>
            <div class="popup-player"></div>
            <div class="popup-task"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
        <div class="footer-content">
            <div class="footer-section">
                <span class="footer-brand">Random Challenge Hub</span>
                <span class="footer-version">v3.0</span>
            </div>
            <div class="footer-section">
                <a href="legal/privacy_policy.html" data-i18n="footer.privacy"></a>
                <span class="footer-divider">|</span>
                <a href="legal/terms_of_service.html" data-i18n="footer.terms"></a>
                <span class="footer-divider">|</span>
                <a href="legal/disclaimer.html" data-i18n="footer.disclaimer"></a>
                <span class="footer-divider">|</span>
                <a href="legal/about.html" data-i18n="footer.about"></a>
                <span class="footer-divider">|</span>
                <a href="i18n/progress.html" data-i18n="footer.lang_progress"></a>
            </div>
            <div class="footer-section">
                <span class="footer-text" data-i18n="footer.local_storage"></span>
            </div>
        </div>
    </footer>

    <script src="js/bus.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/integrations.js"></script>
    <script src="script.js"></script>
    <script src="js/streamer.js"></script>
    <script src="js/auction.js"></script>

    <script>
        // Re-render the active tab when the language changes
        window.addEventListener('rch:langchange', function () {
            window.__rchLangHandled = true;
            if (typeof createTabs === 'function' && typeof currentTab !== 'undefined') createTabs(currentTab);
            if (typeof currentTheme !== 'undefined') {
                document.querySelectorAll('.theme-btn').forEach(function (b) {
                    if (typeof t === 'function') b.title = t('settings.theme_' + b.dataset.theme);
                });
            }
            if (typeof refreshConnChips === 'function') refreshConnChips();
        });

        // "About" card is shown once, then folded away
        (function () {
            var el = document.getElementById('aboutProject');
            if (!el) return;
            try { if (!localStorage.getItem('rch_about_seen')) el.hidden = false; } catch (e) { el.hidden = false; }
        })();
        function dismissAbout() {
            try { localStorage.setItem('rch_about_seen', '1'); } catch (e) { }
            var el = document.getElementById('aboutProject'); if (el) el.hidden = true;
            scrollToTabs();
        }

        // Apply stored theme before first paint of the app
        (function () {
            var th = localStorage.getItem('appTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', th);
        })();
    </script>
</body>
